[project]
name = "arabic-legal-document-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "jq>=1.12.0",
    "langchain-community==0.4.1",
    "langchain-core>=1.6.2",
    "langchain-cohere>=0.6.0",
    "langchain-text-splitters>=1.1.2",
    "mlflow>=3.16.1",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-json-logger>=4.2.0",
    "qdrant-client>=1.19.0",
    "ragas==0.3.9",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
    "uvicorn>=0.52.4",
    "langchain-google-genai>=4.4.0",
    "google>=3.0.0",
    "ollama>=0.6.2",
    "langchain-ollama>=1.1.0",
    "datasets>=5.0.1",
    "torch==2.10.0",
    "openai>=3.3.0",
    "bentoml>=1.4.39",
    "locust>=2.46.7",
    "vllm==0.19.1",
]

[project.scripts]
arabic-legal-document-qa = "arabic_legal_document_qa:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "locust>=2.46.7",
    "pytest>=9.0.0",
    "ruff>=0.16.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff.lint]
extend-ignore = [
    "N999",
    "FLY002",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
