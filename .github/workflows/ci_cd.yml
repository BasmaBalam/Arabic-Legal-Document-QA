name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ragas:
        description: "Run the RAGAS evaluation (requires a configured evaluation environment)"
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.13.0

      - name: Run Linting Checks
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  unit-tests:
    name: 2. Unit Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Project Dependencies
        run: uv sync --locked --group dev

      - name: Run Unit Tests
        run: uv run pytest tests/unit/ -v

  build-corpus:
    name: 3. Rebuild Legal Corpus
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Project Dependencies
        run: uv sync --locked --group dev

      - name: Rebuild Processed Legal Corpus
        run: uv run dvc repro

      - name: Upload Processed Corpus
        uses: actions/upload-artifact@v7
        with:
          name: processed-corpus
          path: data/processed/egyptian_civil_code.json
          if-no-files-found: error
          retention-days: 1

  ragas-evaluation:
    name: 4. Optional RAGAS Evaluation
    if: github.event_name == 'workflow_dispatch' && inputs.run_ragas
    needs: build-corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Project Dependencies
        run: uv sync --locked --group dev

      - name: Download Processed Corpus
        uses: actions/download-artifact@v7
        with:
          name: processed-corpus
          path: data/processed

      - name: Check Evaluation Configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required for this evaluation configuration."
            exit 1
          fi

      - name: Run RAGAS Faithfulness Quality Gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_BACKEND: ${{ secrets.GENERATION_BACKEND }}
          EMBEDDING_BACKEND: ${{ secrets.EMBEDDING_BACKEND }}
        run: uv run pytest tests/eval/test_ragas_quality_gate.py -v -s

  build-and-push:
    name: 5. Build & Push Docker Image
    needs: build-corpus
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Processed Corpus
        uses: actions/download-artifact@v7
        with:
          name: processed-corpus
          path: data/processed

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
